[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dunvyr-backend"
version = "0.1.0"
description = "Backend skeleton for the Dunvyr modular monolith."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic",
    "fastapi",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "httpx",
    "import-linter",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dunvyr"]

[tool.uv]
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated tests (no working database; in-memory or tmp-path engines only)",
    "integration: integration tests running the app against a migrated SQLite database",
]

[tool.ruff]
target-version = "py314"
src = ["src", "tests", "migrations"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["dunvyr"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/dunvyr", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[tool.importlinter]
root_packages = ["dunvyr"]

[[tool.importlinter.contracts]]
name = "Adventures public contract imports no inner layers"
type = "forbidden"
source_modules = ["dunvyr.adventures.public"]
forbidden_modules = [
    "dunvyr.adventures.application",
    "dunvyr.adventures.infrastructure",
    "dunvyr.adventures.presentation",
]

[[tool.importlinter.contracts]]
name = "Adventures layering: presentation > application > domain"
type = "layers"
layers = ["dunvyr.adventures.presentation", "dunvyr.adventures.application", "dunvyr.adventures.domain"]

[[tool.importlinter.contracts]]
name = "Adventures layering: infrastructure > application > domain"
type = "layers"
layers = ["dunvyr.adventures.infrastructure", "dunvyr.adventures.application", "dunvyr.adventures.domain"]

[[tool.importlinter.contracts]]
name = "Adventures domain imports no outer layers"
type = "forbidden"
source_modules = ["dunvyr.adventures.domain"]
forbidden_modules = ["dunvyr.adventures.application", "dunvyr.adventures.infrastructure", "dunvyr.adventures.presentation", "dunvyr.adventures.public", "dunvyr.campaigns", "dunvyr.identity"]

[[tool.importlinter.contracts]]
name = "Adventures application imports no adapters"
type = "forbidden"
source_modules = ["dunvyr.adventures.application"]
forbidden_modules = ["dunvyr.adventures.infrastructure", "dunvyr.adventures.presentation"]

[[tool.importlinter.contracts]]
name = "Domain contexts are mutually independent except public contracts"
type = "forbidden"
source_modules = [
    "dunvyr.identity",
    "dunvyr.campaigns",
    "dunvyr.characters",
    "dunvyr.adventures",
    "dunvyr.gameplay",
    "dunvyr.communication",
    "dunvyr.narration",
]
forbidden_modules = [
    "dunvyr.identity.domain",
    "dunvyr.identity.application",
    "dunvyr.identity.infrastructure",
    "dunvyr.identity.presentation",
    "dunvyr.campaigns.domain",
    "dunvyr.campaigns.application",
    "dunvyr.campaigns.infrastructure",
    "dunvyr.campaigns.presentation",
    "dunvyr.characters.domain",
    "dunvyr.characters.application",
    "dunvyr.characters.infrastructure",
    "dunvyr.characters.presentation",
    "dunvyr.adventures.domain",
    "dunvyr.adventures.application",
    "dunvyr.adventures.infrastructure",
    "dunvyr.adventures.presentation",
    "dunvyr.gameplay.domain",
    "dunvyr.gameplay.application",
    "dunvyr.gameplay.infrastructure",
    "dunvyr.gameplay.presentation",
    "dunvyr.communication.domain",
    "dunvyr.communication.application",
    "dunvyr.communication.infrastructure",
    "dunvyr.communication.presentation",
    "dunvyr.narration.domain",
    "dunvyr.narration.application",
    "dunvyr.narration.infrastructure",
    "dunvyr.narration.presentation",
]

[[tool.importlinter.contracts]]
name = "Shared primitives do not import domain contexts"
type = "forbidden"
source_modules = ["dunvyr.shared"]
forbidden_modules = [
    "dunvyr.identity",
    "dunvyr.campaigns",
    "dunvyr.characters",
    "dunvyr.adventures",
    "dunvyr.gameplay",
    "dunvyr.communication",
    "dunvyr.narration",
]

[[tool.importlinter.contracts]]
name = "Contexts do not import foreign domain/application/infrastructure layers"
